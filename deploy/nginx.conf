server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    # ============================================================
    # Basic Auth（2026-10-11）：这套 API 没有登录认证，裸奔等于把净值/持仓
    # 公开给所有知道 IP 的人（公网 IP 几天内必被扫描器索引）。
    #
    # `satisfy any` + allow 127.0.0.1 的组合是给 **容器健康检查** 留的口子：
    #   · compose 的 healthcheck 在容器内 curl 127.0.0.1，源地址就是 127.0.0.1
    #     → 命中 allow，免认证，healthcheck 不会被 401 卡死；
    #   · 外部用户（公网来源）必须带 .htpasswd 的账号密码，否则 401。
    # 密码文件由 deploy/gen-auth.sh 生成（deploy/.htpasswd），不进 git。
    # ============================================================
    satisfy any;
    allow 127.0.0.1;
    deny all;
    auth_basic "Stock System";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # gzip：前端产物里 element-plus 的 JS 有 1MB+，压缩后 340KB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/vnd.ms-fontobject font/ttf font/otf image/svg+xml;

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后能拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 回测/参数寻优是长任务，超时给足
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
    }

    # 后端接口文档（可选暴露，方便内网查看）
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA 前端路由：所有未命中的路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
