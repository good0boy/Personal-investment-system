# ============================================================
# 数据源能力声明 —— AKShare
# 模块 1「数据源能力矩阵」页面的数据来源。
# ============================================================

# ★ 2026-10-01 重大变更：东财 push2 / push2his 域名在本机被网络掐断
#   （ConnectionError / RemoteDisconnected，非限频）。受影响的能力已在下文
#   逐项标注为「本机失效」，并注明由同花顺承接的路径。
#   仅 push2ex（涨停板系列）与 datacenter-web（龙虎榜/沪深港通）仍可用。
name: "akshare"
display_name: "AKShare"
role: "广度补充源"
package: "akshare"
version_pin: "1.18.94"
homepage: "https://akshare.akfamily.xyz/data/stock/stock.html"
license: "免费，无需注册"

# ★ 实测标记：true = 本环境真实调用验证过
verified: true
verified_at: "2026-09-16"
verified_by: "旺财（隔离环境实测，akshare 1.18.94）"
verified_note: null
measured_function_count:
  total: 1083
  stock_: 403
  index_: 78
  fund_: 74
  tool_: 1

# 代码格式 —— 实测共 5 种，这是最容易踩的坑
symbol_format: "不统一，实测共 5 种"
symbol_formats:
  plain:
    example: "600519"
    interfaces: ["stock_zh_a_hist", "stock_zh_a_hist_min_em", "stock_zh_a_spot_em", "stock_individual_info_em"]
  prefix:
    example: "SZ000895"
    interfaces: ["stock_zh_valuation_comparison_em"]
  suffix:
    example: "301389.SZ"
    interfaces: ["stock_financial_analysis_indicator_em"]
  report_period:
    example: "20230930"
    note: "★ 入参是报告期日期，不是股票代码"
    interfaces: ["stock_zh_a_gdhs", "stock_fhps_em", "stock_yjkb_em"]
  chinese_name:
    example: "上证A股"
    interfaces: ["stock_a_gxl_lg", "stock_market_pe_lg"]
symbol_note: "调用前必须按接口声明的 symbol_format 转换，见 services/data_source/symbols.py"

# 会话
auth:
  required: false
  note: "无需登录"

# 能力矩阵
capabilities:
  daily_kline:
    supported: false
    quality: "none"
    note: >-
      ❌ 本机失效：stock_zh_a_hist 走 push2his.eastmoney.com，实测被掐断，
      条目已从接口目录下架。历史日线请用 baostock（主源）或 fuyao
    priority: "-" 
  minute_kline:
    supported: false
    quality: "none"
    note: "❌ 本机失效：stock_zh_a_hist_min_em 走 push2his，实测被掐断，已下架"
    priority: "-" 
  adjust_factor:
    supported: false
    quality: "none"
    note: "❌ 本机失效：依赖 stock_zh_a_hist（push2his），已下架"
    priority: "-" 
  realtime_quote:
    supported: false
    quality: "none"
    note: >-
      ❌ 本机失效：stock_zh_a_spot_em 走 push2.eastmoney.com（82.push2），
      实测被掐断，条目已下架。**改用 fuyao 的 /api/a-share/prices/snapshot**
    priority: "-" 
  daily_st_status:
    supported: false
    quality: "none"
    note: "❌ 只有当前 ST 列表 stock_zh_a_st_em，无历史逐日状态"
    priority: "-"
  halt_status:
    supported: false
    quality: "poor"
    note: "❌ 无停牌字段，只能靠成交量推断（不可靠）"
    priority: "-"
  delisted_history:
    supported: true
    quality: "fair"
    note: "部分退市股可取，稳定性一般"
    priority: "备选"
  historical_index_cons:
    supported: false
    quality: "none"
    note: "❌ index_stock_cons_* 三个接口均不接受日期参数，只能拿当前成分"
    priority: "-"
  all_stock_list:
    supported: false
    quality: "none"
    note: "❌ 本机失效：依赖 stock_zh_a_spot_em（push2）。改用 fuyao /api/meta/tickers/list"
    priority: "-" 
  trade_calendar:
    supported: true
    quality: "excellent"
    note: "tool_trade_date_hist_sina() 实测 8797 行（1990-12-19 ~ 2026-12-31）"
    priority: "备选"
  index_daily:
    supported: false
    quality: "none"
    note: "❌ 本机失效：index_zh_a_hist 走 push2his，已下架。指数行情用 baostock 或 fuyao"
    priority: "-" 
  fundamentals:
    supported: true
    quality: "excellent"
    note: "★ 1083 个接口的广度在这里体现：财务报表/财务指标/股东/分红/主营构成/盈利预测"
    priority: "主用"
  industry_classification:
    supported: true
    quality: "good"
    note: >-
      ★ 2026-10-01 改由同花顺承担：stock_board_industry_name_ths（本机实测 90 行 /
      0.2s）。东财的 stock_board_industry_name_em 走 push2，已下架
    priority: "主用（同花顺）"
  sector_board:
    supported: true
    quality: "good"
    note: >-
      ★ 2026-10-01 改由同花顺承担：列表 stock_board_{industry,concept}_name_ths、
      历史 stock_board_*_index_ths（实测半导体拉 2026 全年正常）。
      ⚠️ akshare **没有** *_ths 成分股接口 → 成分股由 fuyao 承担
    priority: "主用（同花顺）"
  fund_flow:
    supported: true
    quality: "fair"
    note: >-
      ⚠️ 个股资金流（stock_individual_fund_flow / _rank）走 push2/push2his，
      **本机失效已下架**；改成同花顺的 stock_fund_flow_industry（行业资金流，实测可用）
    priority: "备选（仅行业级）"
  limit_pool:
    supported: true
    quality: "fair"
    note: >-
      ⚠️ stock_zt_pool_em 等 6 个涨停板接口走 push2ex.eastmoney.com，本机**可用**
      （实测 0.2~0.3s）；但该接口**只保留最近 1~2 个交易日**，历史日期一律空表。
      要历史涨跌停请用 fuyao 的 limit_up_pool（date_ms 可指定历史交易日）
    priority: "备选（仅近 1~2 日）"
  dragon_tiger:
    supported: true
    quality: "excellent"
    note: "★ stock_lhb_detail_em 龙虎榜（走 datacenter-web，本机可用）"
    priority: "主用"

# 稳定性评估
stability:
  interface_change_risk: "high"
  note: "★ 版本间常有 breaking change。实测已发现 stock_a_indicator_lg 被移除。必须锁版本 + 启动自检。"

# 已知坑
pitfalls:
  - "★ 股票代码格式共 5 种，没有统一约定（见 symbol_formats）"
  - "stock_zh_a_hist 日期格式 YYYYMMDD，但 stock_zh_a_hist_min_em 是 'YYYY-MM-DD HH:MM:SS'"
  - "stock_a_indicator_lg 已在 1.18.94 移除 → 个股估值改用 stock_zh_valuation_baidu"
  - "index_stock_cons_* 系列不接受日期参数，拿不到历史成分股"
  - "stock_zh_a_hist 返回的成交量单位是【手】，与 baostock 的【股】不同（本项目的 akshare_client 已统一处理）"
  - "pip 默认会装 pandas 3.0，需显式约束 pandas>=2.2,<3.0"
  - "★ 2026-10-01：东财 push2 / push2his 域名在本机被网络掐断（RemoteDisconnected），相关接口已从目录下架；同花顺（10jqka）与 push2ex.datemoney 正常"
  - "★ 熔断已按线路分组（data_source/line_groups.py）：push2 线路故障不再连坐同花顺与 push2ex"
