    当日个股异动原因列表（异动解读 + 关键词）。可按异动标签过滤。
    ⚠️ **只有当日**（无日期参数）→ 无法回补历史，只能从接入日起累积。
    非交易日 / 当日数据未就绪时返回空表或 code=3002
  params:
