- id: quote_realtime.stock_intraday_em
  name: 当日分时成交
  sub_category: 分时
  datasource: akshare
  func_name: stock_intraday_em
  description: 东方财富-分时数据，逐笔成交明细（时间/价格/手数/买卖盘性质）
  symbol_format: plain
  params:
    - { name: symbol, type: str, default: "600519", desc: "股票代码（6 位数字）" }
  returns:
    - { name: 时间, type: str, desc: "成交时间" }
    - { name: 成交价, type: float, desc: "成交价（元）" }
    - { name: 手数, type: int, desc: "手数" }
    - { name: 买卖盘性质, type: str, desc: "买盘/卖盘/中性盘" }
  sample_params: { symbol: "600519" }
  tags: [实时, 东财, 分时]
  returns_verified: true
  returns_note: "实测约 3600 行 × 4 列（一个交易日的逐笔）"

