    - { name: thscode, type: str, desc: "600519.SH" }
    - { name: stock_name, type: str, desc: "股票名称" }
    - { name: tag_name, type: str, desc: "异动标签（涨停/跌停/大涨/大跌/快速拉升/快速下挫）" }
    - { name: analysis_content, type: str, desc: "异动解读内容" }
    - { name: keyword_list, type: str, desc: "关键词列表（数组）" }
  sample_params: {}
  tags: [异动, 同花顺, fuyao, 情绪]
  returns_verified: false
  returns_note: "⚠️ 实测当日为休市（2026-10-01 国庆）返回空表，字段集依据官方文档"

