- id: quote_realtime.fuyao_snapshot
  name: A股行情快照（同花顺官方 REST）★
  sub_category: 快照
  datasource: fuyao
  func_name: snapshot
  description: >-
    同花顺-全 A 股行情快照。`thscodes` 逗号分隔则批量取（按入参顺序）；
    省略则遍历全市场并按 limit/offset 分页。
    ⚠️ 返回**不含中文名**（需配合 标的检索/列表 接口解析），
    且列名是英文（last_price / price_change_ratio_pct ...）——
    与 akshare 的 stock_zh_a_spot_em 不是同一套 schema，不可互换
  params:
    - { name: thscodes, type: str, default: "", desc: "逗号分隔的 thscode（省略=全市场分页）" }
    - { name: limit, type: int, default: 60, desc: "每页条数" }
  returns:
    - { name: thscode, type: str, desc: "600519.SH" }
    - { name: ticker, type: str, desc: "6 位代码" }
    - { name: last_price, type: float, desc: "最新价" }
    - { name: price_change, type: float, desc: "涨跌额" }
    - { name: price_change_ratio_pct, type: float, desc: "涨跌幅 %" }
    - { name: open_price, type: float, desc: "今开" }
    - { name: high_price, type: float, desc: "最高" }
    - { name: low_price, type: float, desc: "最低" }
    - { name: prev_price, type: float, desc: "昨收" }
    - { name: volume, type: float, desc: "成交量（股）" }
    - { name: turnover, type: float, desc: "成交额（元）" }
  sample_params: { thscodes: "600519.SH,000001.SZ" }
  tags: [实时, 快照, 同花顺, fuyao, 核心接口]
  returns_verified: true
  returns_note: "实测批量 2 只返回 2 行 × 11 列（本机，2026-10-01）"

- id: quote_realtime.fuyao_index_snapshot
  name: 板块/指数快照（同花顺官方 REST）
  sub_category: 板块
  datasource: fuyao
  func_name: index_snapshot
  description: >-
    同花顺-板块/指数最新行情。⚠️ `thscodes` **必须传**（逗号分隔），
    不支持空入参枚举全部指数
  params:
    - { name: thscodes, type: str, default: "886042.TI,881101.TI", desc: "逗号分隔的板块/指数 thscode" }
  returns:
    - { name: thscode, type: str, desc: "886042.TI" }
    - { name: ticker, type: str, desc: "纯代码" }
    - { name: last_price, type: float, desc: "最新价" }
    - { name: price_change_ratio_pct, type: float, desc: "涨跌幅 %" }
    - { name: open_price, type: float, desc: "今开" }
    - { name: high_price, type: float, desc: "最高" }
    - { name: low_price, type: float, desc: "最低" }
    - { name: prev_price, type: float, desc: "昨收" }
    - { name: volume, type: float, desc: "成交量" }
    - { name: turnover, type: float, desc: "成交额（元）" }
  sample_params: { thscodes: "886042.TI,881101.TI" }
  tags: [板块, 快照, 同花顺, fuyao]
  returns_verified: false
  returns_note: "结构同 A 股快照接口（同一套 PriceSnapshotItem）"
