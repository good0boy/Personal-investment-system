  params: []
  returns:
    - { name: 交易日, type: str, desc: "交易日" }
    - { name: 类型, type: str, desc: "沪股通/深股通/港股通（沪/深）" }
    - { name: 板块, type: str, desc: "板块" }
    - { name: 资金方向, type: str, desc: "资金方向" }
    - { name: 成交净买额, type: float, desc: "净买额（亿）" }
    - { name: 资金净流入, type: float, desc: "净流入（亿）" }
    - { name: 当日资金余额, type: float, desc: "余额（亿）" }
    - { name: 上涨数, type: int, desc: "上涨家数" }
    - { name: 相关指数, type: str, desc: "相关指数名" }
    - { name: 指数涨跌幅, type: float, desc: "指数涨跌幅 %" }
  sample_params: {}
  tags: [北向, 东财]
  returns_verified: true
  returns_note: "实测 4 行 × 13 列"

- id: quote_realtime.stock_zt_pool_em
  name: 涨停股池
  sub_category: 涨跌停
  datasource: akshare
  func_name: stock_zt_pool_em
  description: 东方财富-涨停板行情-涨停股池（含封板资金、连板数）
  params:
    - { name: date, type: str, required: true, default: "20240102", desc: "交易日（YYYYMMDD）" }
  returns:
    - { name: 序号, type: int, desc: "序号" }
    - { name: 代码, type: str, desc: "6 位代码" }
    - { name: 名称, type: str, desc: "简称" }
    - { name: 涨跌幅, type: float, desc: "涨跌幅 %" }
    - { name: 最新价, type: float, desc: "最新价" }
    - { name: 成交额, type: float, desc: "成交额" }
    - { name: 流通市值, type: float, desc: "流通市值" }
    - { name: 换手率, type: float, desc: "换手率 %" }
    - { name: 封板资金, type: float, desc: "封板资金（元）" }
    - { name: 首次封板时间, type: str, desc: "首封时间" }
    - { name: 最后封板时间, type: str, desc: "末封时间" }
    - { name: 炸板次数, type: int, desc: "炸板次数" }
    - { name: 涨停统计, type: str, desc: "如 2/2（N天M板）" }
    - { name: 连板数, type: int, desc: "连板数" }
    - { name: 所属行业, type: str, desc: "行业" }
  sample_params: { date: "20240102" }
  tags: [涨跌停, 东财, 情绪]
  returns_verified: false
  returns_note: "⚠ 东财该接口只保留最近 1~2 个交易日，历史日期一律返回空表 → 列名无法核对。根因见 quote_history.yaml 末尾「已知限制」"
  returns_note: "接口连通（HTTP 200），但样例日期返回空表未能核对列名；列名依据 akshare 文档"

