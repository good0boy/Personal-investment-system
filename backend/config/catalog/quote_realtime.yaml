    - { name: price_change_ratio_pct, type: float, desc: "涨跌幅 %" }
    - { name: open_price, type: float, desc: "今开" }
    - { name: high_price, type: float, desc: "最高" }
    - { name: low_price, type: float, desc: "最低" }
    - { name: prev_price, type: float, desc: "昨收" }
    - { name: volume, type: float, desc: "成交量" }
    - { name: turnover, type: float, desc: "成交额（元）" }
  sample_params: { thscodes: "886042.TI,881101.TI" }
  tags: [板块, 快照, 同花顺, fuyao]
