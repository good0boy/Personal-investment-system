# ============================================================
# 模块 1 · 接口目录 —— 实时行情
# ============================================================
# ⚠️ 实时接口的返回是"当下"的，本目录中的行数/列数为探测当日的快照，
#    实际行数会随市场变化（全市场快照约 5600 行）。

- id: quote_realtime.stock_zh_a_spot_em
  name: 全市场实时快照 ★
  sub_category: 快照
  datasource: akshare
  func_name: stock_zh_a_spot_em
  description: 东方财富-沪深京 A 股实时行情。一次返回全部 A 股（5000+ 只），是实时数据的首选接口 —— 优先用它而不是逐股拉取
  params: []
  returns:
    - { name: 代码, type: str, desc: "6 位代码" }
    - { name: 名称, type: str, desc: "简称" }
    - { name: 最新价, type: float, desc: "最新价（元）" }
    - { name: 涨跌幅, type: float, desc: "涨跌幅 %" }
    - { name: 涨跌额, type: float, desc: "涨跌额" }
    - { name: 成交量, type: float, desc: "成交量（手）" }
    - { name: 成交额, type: float, desc: "成交额（元）" }
    - { name: 振幅, type: float, desc: "振幅 %" }
    - { name: 最高, type: float, desc: "最高价" }
    - { name: 最低, type: float, desc: "最低价" }
    - { name: 今开, type: float, desc: "今开" }
    - { name: 昨收, type: float, desc: "昨收" }
    - { name: 量比, type: float, desc: "量比" }
    - { name: 换手率, type: float, desc: "换手率 %" }
    - { name: 市盈率-动态, type: float, desc: "动态 PE" }
    - { name: 市净率, type: float, desc: "PB" }
    - { name: 总市值, type: float, desc: "总市值（元）" }
    - { name: 流通市值, type: float, desc: "流通市值（元）" }
    - { name: 60日涨跌幅, type: float, desc: "60 日涨跌幅 %" }
    - { name: 年初至今涨跌幅, type: float, desc: "年初至今 %" }
  sample_params: {}
  tags: [实时, 东财, 全市场, 核心接口]
  returns_verified: false
  returns_note: "本机代理对东财 push2 域名受限未能实测；列名依据 akshare 文档。系统内部使用经 akshare_client.fetch_spot()（含字段映射）"

- id: quote_realtime.stock_bid_ask_em
