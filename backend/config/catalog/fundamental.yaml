    - { name: thscode, type: str, desc: "600519.SH" }
    - { name: ticker, type: str, desc: "6 位代码" }
    - { name: name, type: str, desc: "名称" }
    - { name: exchange, type: str, desc: "交易所后缀 SH/SZ/BJ" }
    - { name: asset_type, type: str, desc: "规范化资产类型" }
