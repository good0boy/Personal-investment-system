- id: fundamental.stock_financial_abstract
  name: 财务摘要（关键指标）
  sub_category: 财务指标
  datasource: akshare
  func_name: stock_financial_abstract
  description: 新浪财经-财务报表-关键指标。行为指标（选项列），列为各报告期
  symbol_format: plain
  params:
    - { name: symbol, type: str, default: "600519", desc: "股票代码（6 位数字）" }
  returns:
    - { name: 选项, type: str, desc: "指标分组（按报告期/按年度等）" }
    - { name: 指标, type: str, desc: "指标名（如 归母净利润/营业总收入）" }
    - { name: "<报告期 YYYYMMDD>", type: float, desc: "各报告期数值，一列一期" }
  sample_params: { symbol: "600519" }
  tags: [财务, 新浪, 宽表]
  returns_verified: true
  returns_note: "实测 80 行 × 105 列（600519）；列为 2017~2026 各报告期"

- id: fundamental.stock_financial_analysis_indicator_em
  name: 财务分析主要指标（东财）
  sub_category: 财务指标
  datasource: akshare
  func_name: stock_financial_analysis_indicator_em
  description: 东方财富-A股-财务分析-主要指标。字段名为东财编码（EPSJB=每股收益基本等），141 列
  symbol_format: suffix
  params:
    - { name: symbol, type: str, default: "600519.SH", desc: "股票代码（带市场后缀，如 600519.SH）" }
    - { name: indicator, type: str, default: "按报告期", desc: "指标周期", options: ["按报告期", "按单季度"] }
  returns:
    - { name: SECURITY_NAME_ABBR, type: str, desc: "证券简称" }
    - { name: REPORT_DATE, type: str, desc: "报告期" }
    - { name: NOTICE_DATE, type: str, desc: "公告日期（财务数据对齐用公告日，防未来函数）" }
    - { name: EPSJB, type: float, desc: "基本每股收益" }
    - { name: BPS, type: float, desc: "每股净资产" }
    - { name: ROEJQ, type: float, desc: "净资产收益率（加权）" }
    - { name: XSMLL, type: float, desc: "销售毛利率" }
    - { name: TOTALOPERATEREVE, type: float, desc: "营业总收入" }
    - { name: PARENTNETPROFIT, type: float, desc: "归母净利润" }
    - { name: "...其余 132 列", type: "-", desc: "完整字段见东财 F10 或试跑结果" }
  sample_params: { symbol: "600519.SH", indicator: "按报告期" }
  tags: [财务, 东财, 宽表]
  returns_verified: true
  returns_note: "实测 103 行 × 141 列；上表仅列出常用列"

