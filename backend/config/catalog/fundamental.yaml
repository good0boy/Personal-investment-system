- id: fundamental.stock_individual_info_em
  name: 个股基本信息
  sub_category: 个股资料
  datasource: akshare
  func_name: stock_individual_info_em
  description: 东方财富-个股信息：总股本、流通股、行业、上市时间等静态资料
  symbol_format: plain
  params:
    - { name: symbol, type: str, default: "600519", desc: "股票代码（6 位数字）" }
  returns:
    - { name: item, type: str, desc: "条目名（总股本/流通股/行业/上市时间等）" }
