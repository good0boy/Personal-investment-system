- id: fundamental.fuyao_tickers_list
  name: 标的代码表（同花顺官方 REST）
  sub_category: 股票名单
  datasource: fuyao
  func_name: tickers_list
  description: >-
    同花顺-标的列表（A股/指数/基金/期货/期权等）。含上市日期与交易所后缀，
    是 thscode（600519.SH）与本地 sh.600519 互转的对端依据
  params:
    - { name: asset_type, type: str, default: "a-share", desc: "资产类型", options: ["a-share", "a-share-index", "fund-etf", "fund-lof", "fund-otc", "forex", "futures", "options"] }
