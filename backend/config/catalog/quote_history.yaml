  params:
    - { name: symbol, type: str, default: "600519", desc: "股票代码" }
    - { name: start_date, type: str, default: "2024-01-02 09:30:00", desc: "开始时间（YYYY-MM-DD HH:MM:SS）" }
    - { name: end_date, type: str, default: "2024-01-02 15:00:00", desc: "结束时间（同上）" }
    - { name: period, type: str, default: "5", desc: "分钟数", options: ["1", "5", "15", "30", "60"] }
    - { name: adjust, type: str, required: false, default: "", desc: "复权", options: ["", "qfq", "hfq"] }
  returns:
    - { name: 时间, type: str, desc: "K线时间" }
    - { name: 开盘, type: float, desc: "开盘价" }
    - { name: 收盘, type: float, desc: "收盘价" }
    - { name: 最高, type: float, desc: "最高价" }
    - { name: 最低, type: float, desc: "最低价" }
    - { name: 成交量, type: float, desc: "成交量（手）" }
    - { name: 成交额, type: float, desc: "成交额（元）" }
    - { name: 均价, type: float, desc: "均价" }
  sample_params: { symbol: "600519", start_date: "2024-01-02 09:30:00", end_date: "2024-01-02 15:00:00", period: "5", adjust: "" }
  tags: [分钟线, 东财]
  returns_verified: false
  returns_note: "本机代理受限未能实测；依据 akshare 文档"

- id: quote_history.stock_zh_a_daily
  name: A股日线（新浪，含复权因子）
  sub_category: 个股日线
  datasource: akshare
  func_name: stock_zh_a_daily
  description: 新浪财经-个股日线。★ adjust='hfq-factor'/'qfq-factor' 可直接拿**复权因子**自行计算，这是东财接口做不到的。⚠️ 文档明示大量抓取容易封 IP
  params:
    - { name: symbol, type: str, default: "sh600519", desc: "带小写市场前缀（sh600519）" }
    - { name: start_date, type: str, default: "20240101", desc: "开始日期（YYYYMMDD）" }
    - { name: end_date, type: str, default: "20240131", desc: "结束日期（YYYYMMDD）" }
    - { name: adjust, type: str, required: false, default: "hfq", desc: "复权；另有 hfq-factor / qfq-factor 返回复权因子" }
  returns:
    - { name: date, type: str, desc: "交易日" }
    - { name: open, type: float, desc: "开盘价" }
    - { name: high, type: float, desc: "最高价" }
    - { name: low, type: float, desc: "最低价" }
    - { name: close, type: float, desc: "收盘价" }
    - { name: volume, type: float, desc: "成交量（股）" }
    - { name: amount, type: float, desc: "成交额（元）" }
    - { name: outstanding_share, type: float, desc: "流通股本" }
    - { name: turnover, type: float, desc: "换手率" }
  sample_params: { symbol: "sh600519", start_date: "20240101", end_date: "20240131", adjust: "hfq" }
  tags: [日线, 新浪, 复权因子]
  returns_verified: true
  returns_note: "实测 22 行 × 9 列"

