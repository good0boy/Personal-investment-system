# ============================================================
# 同花顺 fuyao REST —— 涨跌停池 / 连板天梯（2026-10-01 新增）
# ============================================================
# ★ 核心价值：**可以指定历史交易日**（`date_ms`），而东财 push2ex 的涨停池
#   只保留最近 1~2 个交易日（见本文件历史「已知限制」块，问题集 Q1）。
#   这一条直接解决了"东财涨停池无历史数据"的老问题。
# ⚠️ date_ms 接受 YYYYMMDD / YYYY-MM-DD / 毫秒时间戳；**省略 = 当日**。
#    非交易日（含周末、节假日）返回空表，属正常，不是接口坏了。
# ⚠️ 服务端对业务错误也返回 HTTP 200，靠信封 code 判断 —— 客户端已处理。
- id: quote_history.fuyao_limit_up_pool
  name: 涨停股票池（同花顺，含历史）★
  sub_category: 涨跌停
  datasource: fuyao
  func_name: limit_up_pool
  description: >-
    同花顺官方 REST-涨停/连板股票池。含封单额、峰值封单额、封板时间、
    涨停原因、连板数。★ 与东财 stock_zt_pool_em 的关键差别是
    **date_ms 可指定任意历史交易日**，实测 20260929 正常返回。
    size 传 200（服务端上限）时试跑会自动翻页取全，最多 5 页
  params:
    - { name: date_ms, type: date_ms, default: "", desc: "交易日 YYYYMMDD（省略=当日）" }
    - { name: size, type: int, default: 200, desc: "每页条数（服务端上限 200；填 200 时试跑自动翻页取全）" }
    - { name: sort_field, type: str, default: "seal_money", desc: "排序字段", options: ["last_price", "continue_day_cnt", "seal_money", "limit_up_time"] }
    - { name: sort_dir, type: str, default: "desc", desc: "排序方向", options: ["desc", "asc"] }
  returns:
    - { name: thscode, type: str, desc: "600519.SH" }
    - { name: ticker, type: str, desc: "6 位代码" }
    - { name: name, type: str, desc: "简称" }
    - { name: is_st, type: bool, desc: "是否 ST" }
    - { name: is_new, type: bool, desc: "是否未开板新股" }
    - { name: last_price, type: float, desc: "最新价" }
    - { name: price_change_ratio_pct, type: float, desc: "涨跌幅 %" }
    - { name: limit_up_time, type: str, desc: "封板时间 HH:MM" }
    - { name: limit_up_reason, type: str, desc: "涨停原因（如 固态电池+人形机器人）" }
    - { name: continue_day_text, type: str, desc: "连板文本（首板 / 5天4板）" }
    - { name: continue_day_cnt, type: int, desc: "连板数" }
    - { name: seal_money, type: float, desc: "当前封单额（元）" }
    - { name: max_seal_money, type: float, desc: "峰值封单额（元）" }
  sample_params: { size: 200, sort_field: "seal_money", sort_dir: "desc" }
  tags: [涨跌停, 同花顺, fuyao, 情绪, 核心接口]
  returns_verified: true
  returns_note: "实测 20260929 返回 3 行 × 13 列（本机，2026-10-01）。非交易日返回空表属正常"

