    - { name: symbol, type: str, default: "sh.600519", desc: "内部代码格式（sh.600519 / sz.000001）" }
    - { name: start_date, type: str, default: "2024-01-01", desc: "开始日期（YYYY-MM-DD）" }
    - { name: end_date, type: str, default: "2024-01-31", desc: "结束日期（YYYY-MM-DD）" }
    - { name: adjust, type: str, required: false, default: "hfq", desc: "复权（hfq 后复权 / qfq 前复权 / none 不复权）", options: ["hfq", "qfq", "none"] }
  returns:
    - { name: date, type: datetime, desc: "交易日" }
    - { name: symbol, type: str, desc: "内部代码" }
    - { name: open, type: float, desc: "开盘价（复权口径）" }
    - { name: high, type: float, desc: "最高价" }
    - { name: low, type: float, desc: "最低价" }
    - { name: close, type: float, desc: "收盘价" }
    - { name: preclose, type: float, desc: "昨收（复权口径）" }
    - { name: volume, type: int, desc: "成交量（股）—— 注意与 akshare 的「手」不同" }
    - { name: amount, type: float, desc: "成交额（元）" }
    - { name: turn, type: float, desc: "换手率 %" }
    - { name: pct_chg, type: float, desc: "涨跌幅 %（baostock 直接口径，无需自行计算）" }
    - { name: trade_status, type: int, desc: "★ 停牌标记（1=交易 0=停牌）" }
