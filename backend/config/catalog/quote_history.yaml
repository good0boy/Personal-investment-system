# ============================================================
# 东财「涨停/跌停/强势股池」系列：历史日期限制（部分已解决）
# ============================================================
# 涉及 quote_history.stock_zt_pool_previous_em / stock_zt_pool_strong_em
#      + quote_realtime.stock_zt_pool_em（定义在 quote_realtime.yaml）
#
# 现象：传入**历史日期**返回 0 行 × 0 列，但**不报错**（接口连通、HTTP 200）。
# 根因：akshare 这 6 个接口全部只走东财 push2ex.eastmoney.com，而该接口
#       只保留**最近 1~2 个交易日**的数据。
#
# ★ 2026-10-01 更新：**历史涨跌停已由同花顺 fuyao REST 解决** ——
#   见本文件 `quote_history.fuyao_limit_up_pool / _down_pool / _break_pool`，
#   它们的 `date_ms` 可指定任意历史交易日（实测 20260929 正常返回）。
#   所以「东财接口历史空表」现在只是**该接口自身的限制**，
#   不再是项目的能力缺口 —— 要历史数据请用 fuyao 的对应条目。
#
# 东财这三个接口**保留**：它们走 push2ex 域名，本机实测**可用**（0.2~0.3s），
# 与 fuyao 形成两条独立通道（互为校验）。只有 push2 / push2his 域名的东财
# 接口在本机不通，已从目录中移除（见下方「东财接口下架说明」）。
#
# 另一个老问题的处置（2026-09-18 拍板）：
#   三个接口的 default / sample_params 保留 2024-01-02。**试跑会返回空表，
#   这是预期行为，不是接口坏了** —— 前端已对 0 行结果显示「返回空表」提示。

# ============================================================
# 同花顺板块（akshare 内置 `*_ths`）—— 2026-10-01 新增
# ============================================================
# ★ 为什么要加：东财「概念板块 / 行业板块」全部走 push2.eastmoney.com，
#   该域名在本机被网络**掐断**（实测 ConnectionError / RemoteDisconnected），
#   整块不可用；同花顺（10jqka）域名实测全通。
#   akshare 1.18.94 自带 43 个 `*_ths` 函数，板块相关 10 个。
#
# ⚠️ `symbol` 入参是**板块中文名**（如 半导体 / 白酒概念），不是代码 ——
#   这些条目刻意**不声明 `symbol_format`**：声明了会被"股票代码"正则误拦
#   （`_validate_symbol` 只在声明了格式时才校验）。
# ⚠️ akshare **没有** `*_ths` 成分股接口（cons 系列全是 `_em`/`_futu`）——
#   板块成分股由 fuyao（同花顺官方 REST）承担，见本文件末尾 fuyao_* 条目。
- id: quote_history.ths_industry_name
  name: 同花顺行业板块列表 ★
  sub_category: 板块
  datasource: akshare
  func_name: stock_board_industry_name_ths
  description: >-
    同花顺-行业板块名称与代码。**本机实测可用**（0.2s），
    替代已失效的东财 stock_board_industry_name_em。
    返回的 name（中文名）是下面几个板块接口的必填入参
  params: []
  returns:
    - { name: name, type: str, desc: "板块中文名（后续接口的入参）" }
    - { name: code, type: str, desc: "同花顺板块代码（如 881121）" }
  sample_params: {}
  tags: [板块, 同花顺, ths, 核心接口]
  returns_verified: true
  returns_note: "实测 90 行 × 2 列（本机，2026-10-01）"

- id: quote_history.ths_industry_index
  name: 同花顺行业板块历史行情 ★
  sub_category: 板块
