  description: >-
    同花顺-行业板块历史指数。⚠️ symbol 传**中文板块名**（不是代码），
    取值来自上面的板块列表接口。内部用 py_mini_racer 执行 ths.js 生成 cookie
  params:
    - { name: symbol, type: str, default: "半导体", desc: "板块中文名" }
    - { name: start_date, type: str, default: "20260101", desc: "开始日期 YYYYMMDD" }
    - { name: end_date, type: str, default: "20261231", desc: "结束日期 YYYYMMDD" }
  returns:
    - { name: 日期, type: str, desc: "交易日" }
    - { name: 开盘价, type: float, desc: "开盘" }
    - { name: 最高价, type: float, desc: "最高" }
    - { name: 最低价, type: float, desc: "最低" }
    - { name: 收盘价, type: float, desc: "收盘" }
