# ============================================================
# 模块 1 · 接口目录 —— 历史行情
# ============================================================
# ★ 回测与模拟盘的数据一律走 baostock（本页收录其 4 个核心方法）；
#   akshare 的历史接口用于研究参考。两者成交量单位不同：
#   akshare 单位是「手」，baostock 单位是「股」（akshare_client 已统一换算）。

- id: quote_history.stock_zh_a_hist
  name: A股历史行情（日/周/月线）
  sub_category: 个股日线
  datasource: akshare
  func_name: stock_zh_a_hist
  description: 东方财富-个股历史行情，支持日/周/月频与前后复权。研究参考用；回测主数据走 baostock（含 ST/停牌字段）
  symbol_format: plain
  params:
    - { name: symbol, type: str, default: "600519", desc: "股票代码（6 位数字）" }
    - { name: period, type: str, default: "daily", desc: "周期", options: ["daily", "weekly", "monthly"] }
    - { name: start_date, type: str, default: "20240101", desc: "开始日期（YYYYMMDD）" }
    - { name: end_date, type: str, default: "20240131", desc: "结束日期（YYYYMMDD）" }
    - { name: adjust, type: str, required: false, default: "hfq", desc: "复权（qfq 前复权 / hfq 后复权 / 空=不复权）", options: ["", "qfq", "hfq"] }
  returns:
    - { name: 日期, type: str, desc: "交易日" }
    - { name: 股票代码, type: str, desc: "6 位代码" }
    - { name: 开盘, type: float, desc: "开盘价" }
    - { name: 收盘, type: float, desc: "收盘价" }
    - { name: 最高, type: float, desc: "最高价" }
    - { name: 最低, type: float, desc: "最低价" }
    - { name: 成交量, type: float, desc: "成交量（手）" }
    - { name: 成交额, type: float, desc: "成交额（元）" }
    - { name: 振幅, type: float, desc: "振幅 %" }
    - { name: 涨跌幅, type: float, desc: "涨跌幅 %" }
    - { name: 涨跌额, type: float, desc: "涨跌额" }
    - { name: 换手率, type: float, desc: "换手率 %" }
  sample_params: { symbol: "600519", period: "daily", start_date: "20240101", end_date: "20240131", adjust: "hfq" }
  tags: [日线, 复权, 东财, 核心接口]
  returns_verified: true
  returns_note: "2026-09-16 曾实测 12 列；今日探测受本机代理影响未复测。回测请用 baostock（isST/tradestatus 是复权口径与合规字段的唯一可信来源）"

- id: quote_history.stock_zh_a_hist_min_em
  name: A股分钟线
  sub_category: 个股分钟
  datasource: akshare
  func_name: stock_zh_a_hist_min_em
  description: 东方财富-分钟级行情。⚠️ 日期格式是 'YYYY-MM-DD HH:MM:SS'，与日线接口的 YYYYMMDD 不同（实测的坑）
