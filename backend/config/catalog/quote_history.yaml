# ============================================================
# 已知限制：东财「涨停/跌停/强势股池」系列接口
# ============================================================
# 涉及 quote_history.stock_zt_pool_previous_em / stock_zt_pool_strong_em
#      + quote_realtime.stock_zt_pool_em（定义在 quote_realtime.yaml）
#
# 现象：样例日期返回 0 行 × 0 列，但**不报错**（接口连通、HTTP 200）。
#
# 根因（2026-09-18 实测）：
#   akshare 里 6 个同类接口（stock_zt_pool_em / previous_em / strong_em /
#   dtgc_em / zbgc_em / sub_new_em）**全部只走东财 push2ex.eastmoney.com
#   这一个域名**，没有非东财的替代源。而该接口只保留**最近 1~2 个交易日**
#   的数据：
#       20240102 → (0, 0)      20260916 → (89, 16)
#       20240415 → (0, 0)      20260917 → (47, 16)
#       20241231 → (0, 0)      20260918 → (0, 0)  ← 当天数据当日不可得
#   即：**历史日期一律空表**，只有最近一两个交易日能取到。
#
# 处置（主人 2026-09-18 拍板）：
#   暂不外接其他数据源，三个接口的 default / sample_params 统一为
#   2024-01-02。**试跑会返回空表，这是预期行为，不是接口坏了**——
#   前端已对 0 行结果显示「返回空表」提示。
#
# 待办：若要真正用于策略，只能
#   (a) 改为「每日盘后抓取当日」并在本地落盘历史（推荐，与模块 4 日度跑批天然契合）；
#   (b) 或引入 tushare `limit_list`（需积分）/ 自建涨停判定（用 baostock 的
#       preclose + pctChg + 板块涨跌幅限制推导，注意 ST 5%、创业板 20%）。
#   详见 docs/开发进度.md「问题集」Q1。
