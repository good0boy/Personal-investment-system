# ============================================================
# 业务配置（可读、可 diff、可版本管理）
# 密钥类配置一律走 .env，不要写在这里
# ============================================================

app:
  name: "A股投资本地服务"
  version: "0.1.0"

# ---------------- 数据范围 ----------------
data:
  # 预热窗口起点：回测从 2020-06-01 开始，需 20 个交易日预热
  # 2020-01-01 ~ 2020-05-31 共 97 个交易日（已实测），足够
  start_date: "2020-01-01"
  # 拉取终点：跟随最新交易日（脚本会覆盖为最近交易日）
  end_date: "latest"
  # 复权口径：后复权（回测与信号统一）
  # 不复权 = ""，前复权 = "qfq"，后复权 = "hfq"
  adjust: "hfq"
  frequency: "d"

# ---------------- 回测区间 ----------------
backtest:
  # 样本内（调参、定规则、参数寻优）
  in_sample_start: "2020-06-01"
  in_sample_end: "2024-12-31"
  # 样本外（规则冻结后只跑一次，sweep.py 硬编码拒绝此区间）
  out_sample_start: "2025-01-01"
  out_sample_end: "2026-09-16"

# ---------------- 股票池（Universe）----------------
universe:
  # 板块白名单：沪主板 600/601/603/605，深主板 000/001/002/003，创业板 300/301
  boards:
    sh_main: ["600", "601", "603", "605"]
    sz_main: ["000", "001", "002", "003"]
    gem: ["300", "301"]
  # 板块黑名单：科创板 688、北交所 8xx/4xx、B股 900/200
  exclude_prefixes: ["688", "689", "8", "4", "900", "200"]
  # ★ 新股入池门槛（交易日）—— 上市满 90 日后才有资格被选中
  listed_days_min: 90
  # ★ 卖出后禁买窗口（交易日）—— 与上者是两个独立参数，勿混淆
  no_rebuy_days: 60
  # 是否纳入已退市股票（消除幸存者偏差，baostock 支持）
  include_delisted: true
  # ★ 退市（数据永久终止）持仓强平确认窗口（交易日）——
  #   标的无行情且矩阵中已无后续数据，超过该窗口 → 按最后可用收盘价强平。
  #   缓冲防误判：回测终点前 1~2 天恰好缺数据的正常标的不会被当成退市。
  delist_confirm_days: 3

# ---------------- 交易成本（唯一实现见 services/cost_model.py）----------------
cost:
  commission_rate: 0.00025      # 佣金 万2.5
  commission_min: 5.0           # 最低 5 元
  transfer_fee_rate: 0.00001    # 过户费 0.001%
  slippage_bp: 5.0              # 滑点 5 个基点
  stamp_tax:
    # 印花税卖出单边，2023-08-28 减半 —— 必须分段
    - { from_date: "2020-01-01", to_date: "2023-08-25", rate: 0.001 }
    - { from_date: "2023-08-28", to_date: "2099-12-31", rate: 0.0005 }
  lot_size: 100                 # 整手 100 股

# ---------------- 策略默认参数（详见 策略规格说明书.md v1.5）----------------
strategy_defaults:
  init_cash: 1000000
  max_positions: 5              # 寻优候选 5 / 2（与 50% 仓位配合）
  max_weight_per_stock: 0.20    # 按当前总资产；寻优候选 20% / 25% / 50%
  keep_cash: true               # 不足时留现金
  hold_days_max: 10             # 满 N 个交易日强制卖出；寻优候选 10 / 20 / 40
  # 止盈：毛口径（不扣成本）；v1.5 起主板/创业板同值 6%；寻优候选 4%/6%/8%/10%
  take_profit_gross_main: 0.06
  take_profit_gross_gem: 0.06
  index_panic_pct: -0.015       # 上证指数当日收盘跌幅阈值
  # 个股止损：v1.4 新增、v1.5 收紧到 1.2× 且两板块同值（见规格 2.3 条件 6）
  use_stop_loss: true
  stop_loss_amp_window: 5       # 近 5 个交易日平均振幅
  stop_loss_amp_mult_main: 1.2  # 主板：毛亏 ≥ 1.2× 均振幅
  stop_loss_amp_mult_gem: 1.2   # 创业板：同值（不再区分）
  timing:
    index_code: "sh.000001"
    daily_min: -0.01            # 近3个交易日【逐日】涨跌幅均 > -1%
    today_min: -0.005           # 当日 > -0.5%
  entry:
    today_pct_min: 0.01         # 今日涨跌幅下限（通用）
    ret3_min: 0.05              # 近 3 日累计 > 5%（通用，保留）
    ret20_min: 0.05             # 近 20 日累计 > 5%（通用，保留）
    amplitude_window: 5         # 排序键：近 5 日平均振幅降序
    volume_ratio_min: 1.5       # 闸门 4：量比 1 日与 5 日均须 > 1.5
    no_limit_up_days: 10        # 闸门 5（v1.5）：近 N 日（含当日）不得涨停/触板；0 = 关闭
    boards:                     # 闸门 3 板块差异化
      main: { today_pct_max: 0.06, ret10_min: 0.03, ret10_max: 0.15 }
      gem:  { today_pct_max: 0.11, ret10_min: 0.05, ret10_max: 0.20 }
  benchmark: "sh.000001"
  # v1.6 成交时点（已从配置移除 `fill_rule` —— 它从未被引擎读取，是死配置）：
  #   买入 = T 日信号 → T+1 开盘价成交；
  #   清仓卖出 = T 日信号 → **T 日尾盘按收盘价成交**（跌停/停牌顺延 T+1 开盘）。
  #   口径会写进每次回测的 config.json（config_snapshot）。见 策略规格说明书.md v1.6 §7.6。

# ---------------- 策略 v2.0「中频质量反转」默认参数 ----------------
# ★ 独立配置节，与上面的 strategy_defaults（现役 v1.6 momentum）**并存、互不干扰**。
#   规则唯一依据：docs/策略规格说明书-v2.0-中频质量反转.md
#   读取入口：settings.strategy_v2（app/core/config.py::StrategyDefaultsV2）
#   本质差别：买「温和弱势(反转)」而非最强；持有 20~40 交易日（非 ≤10）；
#            每 rebalance_every 日才建仓一次（非每日）→ 换手低、成本目标 ≤3%/年。
strategy_defaults_v2:
  init_cash: 1000000
  max_positions: 10             # 更分散（逆向选股靠广度）
  max_weight_per_stock: 0.10    # 10 只 × 10% = 100%
  hold_days_max: 30             # 目标持有期（交易日）
  rebalance_every: 5            # 每 N 个交易日才建仓一次（控换手）
  index_ret20_min: -0.10        # 门1 大盘非急跌：上证近20日累计 > 此值
  reversal_pct: 0.50            # 门2 反转门：ret_50 ≤ 截面 50 分位（不买最强半数）
  max_ret_20_max: 0.15          # 门2 排除脉冲股：近20日最大单日涨幅上限
  use_quality_gate: true        # 门3 质量门：profit_yoy>0 且 revenue_yoy>0
  use_lowvol_gate: true         # 门4 低波动：volatility_20 ≤ 截面中位
  use_lowturn_gate: true        # 门4 低换手：turnover_20 ≤ 截面中位
  use_liquidity_gate: true      # 门0 流动性：amount_mean_20 ≥ 下限
  min_amount_mean_20: 50000000  # 门0 近20日日均成交额下限（元）
  ma_rise_confirm_window: 0     # 门2c（v2.3，实验参数）：个股 MA_w(t)≥MA_w(t-1) 才可买；0=关闭，可取 3/5/10
  realized_ret20_max: 0.30      # 退出：近20日累计涨幅 ≥ 此值（过度兑现）→ 卖出
  # --- 止损/止盈（v2.1 新增）---
  #   基准 p = |个股近5日累计涨跌幅| ÷ 5（近5日「日均」涨跌幅绝对值，**不是振幅**）。
  #   p 是个股价、每只不同 → 阈值随个股近期波动自适应。0 = 关闭该规则。
  stop_loss_p_mult: 0.0         # 毛亏 ≥ mult×p → 止损；0 = 关闭
  take_profit_p_mult: 0.0       # 毛盈 ≥ mult×p → 止盈；0 = 关闭
  take_profit_abs: 0.0          # 毛盈 ≥ 绝对阈值（0.06 = 6%）→ 止盈；0 = 关闭
  benchmark: "sh.000001"

# ---------------- 数据同步 ----------------
# 每日跑批（paper_daily 23:00）与启动补跑共用的「把本地数据补到最新」。
# ⚠️ 2026-10-08 审计结论：此前就绪探针只有 2 个标的（茅台+上证指数），
#    2026-09-18 一次中断的回补留下 ~555 只的部分数据，探针恰好在其中
#    → 每晚都判「就绪」不回补 → 09-18~09-30 的缺口挂了两周没人发现。
#    覆盖率闸门（min_daily_symbols）就是防这个的。
data_sync:
  # 当日有个股 K 线的数量下限（全市场 ~4570 只的 65%）。低于它 = 行情未就绪 → 触发增量回补。
  min_daily_symbols: 3000
  # 行情就绪后同步股票池快照（tools.backfill_universe --start D --end D，秒级）
  sync_universe: true
  # 行情就绪后重算因子（factors.calc，约 10~20 分钟）。
  # ★ 必须在净值重算之前 —— 策略打分读的是 factor/*.parquet，行情新了、因子旧了 = 旧信号跑新行情。
  sync_factors: true
  # 基本面原始数据陈旧告警阈值（天）。⚠️ 不自动补：backfill_fundamental 全量约 9 小时（东财分页），
  #   放进每日跑批会把 23:00 的 job 拖到天亮；季报频率本来就低，由主人手动跑。
  fundamental_stale_days: 10

# ---------------- 数据源 ----------------
datasource:
  # 行情主源（模块 3/4 只用它）
  primary: "baostock"
  # 广度源（模块 1、实时行情、基本面）
  secondary: "akshare"
  # 请求节流（秒），避免被限频
  min_interval: 0.12
  max_retries: 3
  timeout: 30
  # akshare 试跑结果缓存 TTL（秒）
  try_cache_ttl: 300
  # ★ akshare 专项节流 —— 比 baostock 更严格
  #   理由：东财/新浪对高频访问远比 baostock 敏感，且限频时往往直接掐连接（无 429）
  akshare:
    min_interval: 1.0            # 1 秒最多 1 次调用
    max_calls_per_minute: 30     # 60 秒窗口内最多 30 次
    circuit_break_seconds: 300   # 识别到限频后静默 5 分钟（期间不发任何请求）
    cache_ttl: 300               # 历史类接口缓存 TTL
    spot_cache_ttl: 10           # 实时快照缓存 TTL（实时数据不能缓存太久）

  # ★ 同花顺 fuyao REST —— 特色数据源（涨跌停池 / 板块成分 / 快照 / 元信息）
  #   2026-10-01 实测：东财 push2/push2his 在本机被网络掐断，batch 板块与快照
  #   数据改由同花顺承担（akshare 内置 *_ths + 本接口）。
  #   ⚠️ API Key 不在本文件 —— 真值在 .env 的 FUYAO_API_KEY，
  #      这里只记录"去哪个环境变量取"，避免密钥随 /system/config 泄露。
  fuyao:
    api_key_env: "FUYAO_API_KEY"
    base_url: "https://fuyao.aicubes.cn"
    min_interval: 0.2            # 官方 REST，非爬虫，可比东财宽松
    max_calls_per_minute: 60
    circuit_break_seconds: 120   # 触发限流后静默 2 分钟
    cache_ttl: 300               # 历史类（涨跌停池/板块成分）缓存 TTL
    timeout: 20

# ---------------- 调度 ----------------
scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  jobs:
    # 模拟盘日度跑批：交易日 23:00（主人 2026-09-20 拍板）
    # 为什么不是 15:35：baostock 日线一般 17:30~19:00 才更新完，
    # 23:00 回补（约 30 分钟）+ 重算（约 45s）当天 23:35 前后净值就绪。
    # 数据源若延迟 → 就绪校验拦截记 failed → 次日启动补跑兜底（保底方案）。
    paper_daily:
      cron: { hour: 23, minute: 0 }
      enabled: true
    # 每日持仓早报：交易日 08:00（主人 2026-09-20 拍板）
    # 读上一交易日 23:00 跑批的产物（positions + nav），发「今日持仓 + 仓位」。
    # ⚠️ 数据源是 positions.parquet，**不是** orders.parquet 的"计划单"
    #    —— 引擎的 T 日挂单不落 orders 流水，orders 里的 pending 全是
    #    历史僵尸单（详见 alert_service.notify_daily_summary 的 docstring）。
    # 与 paper_daily 不同：本任务**不判交易日**（读已有产物即可），
    # 闸门是"产物是否存在"。
    alert_daily_summary:
      cron: { hour: 8, minute: 0 }
      enabled: true
    # 接口目录自检：每日 09:00（模块 1 已实现）
    catalog_check:
      cron: { hour: 9, minute: 0 }
      enabled: true
    # 基本面/财务周频回补：每周一 06:00（主人 2026-10-10 拍板：一次性补完，
    # 接受长时间运行）。行情每天补（paper_daily 内），低频数据每周一补。
    # --force 全量重拉 ~9h（三大报表/财务指标接口无增量探测能力，落盘按
    #   [report_date, notice_date] 去重 → 数据效果 = 有更新则补、没有则不变）；
    #   批量数据集（业绩报表/预告/股东户数/分红送配/基金持仓）按报告期记录，
    #   没有新报告期自动跳过 —— 这部分天然"没有则不做操作"。
    # 06:00 + 12h 超时上限 = 18:00 前结束，不与 23:00 paper_daily 重叠。
    fundamental_weekly:
      cron: { day_of_week: mon, hour: 6, minute: 0 }
      enabled: true
    # 模拟盘盘中检查：交易日 14:45（2026-10-09 新增）。
    # 用 fuyao 实时快照价近似当日收盘，对当前持仓做**清仓预警**（time_stop /
    # over_realized / quality_broken / limit_down），15 分钟后尾盘可操作。
    # ⚠️ 只是预警：引擎按 T 日收盘价撮合，实际以当晚 23:00 重算为准。
    paper_intraday_check:
      cron: { hour: 14, minute: 45 }
      enabled: true
  # 启动时补跑缺失交易日（本地关机会漏跑，这是刚需）
  catch_up_on_startup: true
  catch_up_max_days: 30

# ---------------- 模拟盘 ----------------
paper:
  default_account_id: "default"
  default_account_name: "默认模拟账户"
  init_cash: 1000000
  # ★ 模拟盘策略（2026-10-09 主人拍板）：切换为 quality_reversal 的 oosma10-base 口径，
  #   原 momentum 仿真下线。策略变化会触发全量重算（净值曲线整体重写，设计使然）。
  strategy: quality_reversal
  # 跑批执行模式（2026-10-10 主人拍板）：incremental = 单日增量撮合
  # （内存 <500MB / 秒级；state.json 跨日续状态；异常自动回退全量重建）。
  # 回退开关：改回 full 即恢复每晚全量重算（旧语义）。
  engine_mode: incremental
  # oosma10-base 参数显式固化（未列出的键用策略默认）；变更后重启服务生效
  params:
    max_positions: 10
    max_weight_per_stock: 0.10
    hold_days_max: 30
    rebalance_every: 5
    index_ret20_min: -0.10
    reversal_pct: 0.50
    max_ret_20_max: 0.15
    use_quality_gate: true
    use_lowvol_gate: true
    use_lowturn_gate: true
    use_liquidity_gate: true
    min_amount_mean_20: 50000000
    ma_rise_confirm_window: 10
    realized_ret20_max: 0.30
    stop_loss_p_mult: 0.0
    take_profit_p_mult: 0.0
    take_profit_abs: 0.0

# ---------------- 提醒（企微）----------------
alert:
  enabled: true                 # 模块 5 已就位（2026-09-20）。改 false 可一键静默
  # 群机器人频率上限 20 条/分钟，超限排队而非丢弃
  rate_limit_per_minute: 20
  retry_backoff: [1, 5, 30]     # 秒
  max_retry: 3
  # ⚠️ 仅用于**校验**：真实模板路径写死在 core/paths.py 的 ALERT_TEMPLATES_FILE
  #    （本项目头号静默失效就是"配置写了没被读"）。改这里不会生效，
  #    改模板请直接编辑 backend/config/alert_templates.yaml。
  templates_file: "config/alert_templates.yaml"

# ---------------- 日志 ----------------
logging:
  level: "INFO"
  dir: "logs"
  rotation: "10 MB"
  retention: "30 days"
  console: true
