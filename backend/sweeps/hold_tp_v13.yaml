# ============================================================
# 参数寻优网格（v1.3 规则集 · 冻结快照）：72 组
#   止盈档(净口径) × 持有期 × 单票仓位 × 最大持仓数
# ============================================================
# 依据：策略规格说明书.md §7.3（v1.3 变更记录）。
#
# ⚠️ **v1.3 用的是另一份实现**：`strategies/impl/momentum_v13.py`（从 git 取出的冻结快照）。
#    它的规则与 v1.4/v1.5 有**结构性差异**，靠参数调不出来，所以必须换策略：
#      · 闸门 1 是**累计**口径（v1.4 才改逐日）
#      · 闸门 3 **无板块化、无近 10 日上界**（统一 (1%,5%) / 仅下界 5%）
#      · **没有闸门 4（量比）**
#      · 闸门 3.5 **启用**（`exclude_top_pct = 0.2`）
#      · 止盈是**扣成本净口径**（`take_profit_net`，v1.4 才改毛口径）
#      · **不设个股止损**
#
# ⚠️ 本网格**不是 v1.3 的历史网格**：v1.3 当年只跑过 16 组、且没有留存 sweep 产物。
#    这里按主人 2026-10-05 的决定，改用与 v1.4 同构的 72 组，便于三版横向对比。
#
# ⚠️ 成交口径：跑在 **v1.6 引擎**上（清仓 = T 日尾盘按收盘价成交）；
#    v1.3 当年跑的是 T+1 开盘卖出，故与之**不可直接比数字**。
#
# 用法：
#   cd backend
#   python -m strategies.sweep --config sweeps/hold_tp_v13.yaml --tag v1.3 --sweep-id v1.3-sweep
#
# ⚠️ 参数寻优只允许跑**样本内**区间（代码里硬编码拒绝，见 strategies/sweep.py 的 assert_in_sample）。
#
# 网格 = 4 × 3 × 3 × 2 = **72 组**；v1.3 没有闸门 4/5，单组应比 v1.5 快，估 20~30s/组。
# ============================================================

strategy: momentum_v13
description: v1.3 规则集（止盈净口径） × 持有期 × 单票仓位 × 最大持仓数

params:
  hold_days_max: [10, 20, 40]                   # 3 档：最大持有期
  take_profit_net: [0.06, 0.08, 0.10, 0.12]     # 4 档：**扣成本净口径**止盈（v1.3 默认 0.10）
  max_weight_per_stock: [0.20, 0.25, 0.50]      # 3 档：单票仓位
  max_positions: [5, 2]                         # 2 档：最大持仓数

  # ---- 固定单值：闸门 3.5（v1.3 启用，剔除极端动量前 20%）----
  exclude_top_pct: [0.2]

# 敏感性分析：横轴取止盈档，分组轴取持有期。两轴都必须是结果表里真实存在的参数名。
sensitivity:
  x: take_profit_net
  series: hold_days_max

# 主指标：用于挑最优组合与计算敏感性落差
objective: annual_return
