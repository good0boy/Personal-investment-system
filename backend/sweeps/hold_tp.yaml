# ============================================================
# 参数寻优网格（v1.5）：192 组
#   止盈档(同值) × 止损倍数(同值) × 涨停窗口(含 0=关) × 持有期
# ============================================================
# 依据：策略规格说明书.md v1.5 §5.2
#   · 止盈 6% 与止损 1.2× 都是「主板=创业板同值」，故各是一个**联合维度**
#     （候选值为 dict，主板/创业板键同步联动）。
#   · 涨停窗口 [0, 5, 10, 20] 里的 **0 = 关闭闸门 5**，是**内置消融对照**：
#     同一轮网格里就能看出"这条新规则帮了多少倒忙"，不必另跑一次消融。
#
# ⚠️ 为什么**不再扫**「单票仓位」「最大持仓数」：
#   v1.4 的 72 组已实测证明这两维只是**等比缩放风险暴露**（仓位 20%→25%→50%
#   的年化均值 20% 仓 -13.9% ＜ 25% -16.7% ＜ 50% -31.9%，单调），
#   **不产生 alpha**（见 docs/回测与策略研究.md §3.9）。
#   把它们再扫 9 倍时间换不到新信息，故固定为默认值 20% / 5 只。
#
# 用法：
#   cd backend
#   python -m strategies.sweep --config sweeps/hold_tp.yaml --tag v1.5
#
# ⚠️ 参数寻优只允许跑**样本内**区间（2020-06-01 ~ 2024-12-31）。
#    样本外数据在规则冻结前绝不允许被看到 —— 代码里硬编码拒绝
#    （见 strategies/sweep.py 的 assert_in_sample）。
#
# ⚠️ 本网格 3 × 4 × 4 × 4 = **192 组**；实测约 20~35s/组（全市场）
#    → 预计 **1~2 小时**。建议后台跑；正式开跑前先用 --symbols 小样本验证。
# ============================================================

strategy: momentum
description: 止盈档(同值) × 止损倍数(同值) × 涨停窗口(含0=关) × 持有期

# 参数网格：笛卡尔积展开（支持"联合维度"——候选值为 dict 时展开成多个参数键）
# 单票仓位与最大持仓数固定为默认（20% / 5），理由见文件头。
params:
  hold_days_max: [10, 20, 40]                 # 3 档：最大持有期
  take_profit:                                 # 联合维度：两板块同值（4 档，毛口径）
    - { take_profit_gross_main: 0.04, take_profit_gross_gem: 0.04 }
    - { take_profit_gross_main: 0.06, take_profit_gross_gem: 0.06 }
    - { take_profit_gross_main: 0.08, take_profit_gross_gem: 0.08 }
    - { take_profit_gross_main: 0.10, take_profit_gross_gem: 0.10 }
  stop_loss:                                   # 联合维度：两板块同值（4 档）
    - { stop_loss_amp_mult_main: 1.0, stop_loss_amp_mult_gem: 1.0 }
    - { stop_loss_amp_mult_main: 1.2, stop_loss_amp_mult_gem: 1.2 }
    - { stop_loss_amp_mult_main: 1.5, stop_loss_amp_mult_gem: 1.5 }
    - { stop_loss_amp_mult_main: 2.0, stop_loss_amp_mult_gem: 2.0 }
  no_limit_up_days: [0, 5, 10, 20]             # 闸门 5 窗口；0 = 关闭（内置消融对照）

# 敏感性分析：横轴取「闸门 5 窗口」——直接回答"这条新规则值不值"（0 = 关闭）；
# 分组轴取止盈档。两轴都必须是**展开后的**参数名。
sensitivity:
  x: no_limit_up_days
  series: take_profit_gross_main

# 主指标：用于挑最优组合与计算敏感性落差
#   可选 annual_return / total_return / sharpe / calmar
objective: annual_return
